# PCHH — GRUB configuration (used for both BIOS and UEFI boot)
set timeout=5
set default=0

terminal_input console
terminal_output console

if [ -e /boot/grub/pchh-logo.png ]; then
    background_image /boot/grub/pchh-logo.png
fi

menuentry "PCHH - PC Health Check" {
    linux  /boot/vmlinuz root=/dev/ram0 rdinit=/init quiet loglevel=3 console=tty0
    initrd /boot/initramfs.img
}

menuentry "PCHH - Verbose boot (debug)" {
    linux  /boot/vmlinuz root=/dev/ram0 rdinit=/init console=tty0
    initrd /boot/initramfs.img
}

# Memtest86+ is only present if the build host had the package.
# It boots via the legacy Linux loader, so it works in BIOS/CSM mode.
if [ -e /boot/memtest86+.bin ]; then
menuentry "Memtest86+ - thorough RAM test (BIOS/CSM only)" {
    linux /boot/memtest86+.bin
}
fi

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
